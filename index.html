<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Позвоночник 1:1</title>
  <style>
    body { margin:0; overflow:hidden; background:#050510; }
    #info {
      position:absolute; bottom:12px; left:12px; color:white;
      background:rgba(0,0,0,0.7); padding:8px 16px;
      border-radius:20px; font-size:13px; font-family:sans-serif;
    }
  </style>
</head>
<body>
  <div id="info">🦴 Вращай | 🔍 Зум | Двойной тап — сброс</div>

  <!-- Загружаем Three.js напрямую -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- БАЗОВЫЕ НАСТРОЙКИ ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060f);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 50);
    camera.position.set(5, 3.2, 7.5);
    camera.lookAt(0, 2.2, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true, 
      powerPreference: "high-performance" 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // Управление
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 1.1;
    controls.minDistance = 3.2;
    controls.maxDistance = 14;
    controls.update();

    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    // ---------- HDR ОКРУЖЕНИЕ ----------
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x0a0a1a);
    const envGeo = new THREE.SphereGeometry(10, 32, 32);
    const envMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        void main() {
          float y = normalize(vWorldPos).y;
          float t = smoothstep(-0.2, 0.6, y);
          vec3 bottom = vec3(0.02, 0.02, 0.08);
          vec3 top = vec3(0.55, 0.65, 0.9);
          gl_FragColor = vec4(mix(bottom, top, t), 1.0);
        }
      `
    });
    envScene.add(new THREE.Mesh(envGeo, envMat));
    const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
    scene.environment = envMap;

    // ---------- ОСВЕЩЕНИЕ ----------
    scene.add(new THREE.AmbientLight(0x334466));

    const keyLight = new THREE.DirectionalLight(0xffeedd, 1.4);
    keyLight.position.set(6, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    scene.add(keyLight);

    scene.add(new THREE.DirectionalLight(0xccddff, 0.65).position.set(-4, 1, -3));
    scene.add(new THREE.DirectionalLight(0xffccaa, 0.55).position.set(-1, 6, -6));

    // ---------- ТЕКСТУРА КОСТИ ----------
    const boneCanvas = document.createElement('canvas');
    boneCanvas.width = 512;
    boneCanvas.height = 512;
    const ctx = boneCanvas.getContext('2d');
    const imgData = ctx.createImageData(512, 512);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const x = (i/4) % 512, y = Math.floor((i/4)/512);
      const n1 = Math.sin(x*0.15 + y*0.12) * 43758.5453 % 1;
      const n2 = Math.sin(x*0.3 + y*0.25) * 25421.631 % 1;
      const noise = n1*0.7 + n2*0.3;
      imgData.data[i] = 220 + (noise-0.5)*28;
      imgData.data[i+1] = 195 + (noise-0.5)*25;
      imgData.data[i+2] = 165 + (noise-0.5)*23;
      imgData.data[i+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    const boneTex = new THREE.CanvasTexture(boneCanvas);
    boneTex.wrapS = THREE.RepeatWrapping;
    boneTex.wrapT = THREE.RepeatWrapping;
    boneTex.repeat.set(2, 2);

    // ---------- SSS МАТЕРИАЛ ----------
    const boneMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: boneTex },
        envMap: { value: envMap },
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec2 vUv;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vNormal = normalize(mat3(modelMatrix) * normal);
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewDir = normalize(-mvPosition.xyz);
          vUv = uv;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec2 vUv;
        uniform sampler2D map;
        uniform samplerCube envMap;
        void main() {
          vec3 N = normalize(vNormal);
          vec3 V = normalize(vViewDir);
          vec3 L = normalize(vec3(0.5, 0.8, 0.6));
          
          float NdotL = max(0.0, dot(N, L));
          float NdotV = max(0.0, dot(N, V));
          
          float sss = max(0.0, dot(V, -L)) * (1.0 - NdotL) * 0.45;
          sss *= smoothstep(0.0, 1.0, NdotV);
          
          vec3 albedo = texture2D(map, vUv).rgb * vec3(0.93, 0.84, 0.72);
          vec3 ambient = albedo * vec3(0.2, 0.22, 0.3) * 0.7;
          vec3 diffuse = albedo * NdotL * 1.1;
          vec3 sssColor = vec3(1.0, 0.6, 0.27) * sss * 0.8;
          
          vec3 R = reflect(-V, N);
          vec3 envColor = textureCube(envMap, R).rgb;
          float fresnel = pow(1.0 - NdotV, 3.0);
          vec3 specular = mix(vec3(0.04), albedo, fresnel) * envColor * 0.45;
          
          vec3 final = ambient + diffuse + sssColor + specular;
          final = final / (final + vec3(1.0));
          gl_FragColor = vec4(final, 1.0);
        }
      `
    });

    // ---------- ГЕОМЕТРИЯ ПОЗВОНКА ----------
    function createVertebra(type = 'thoracic') {
      const s = new THREE.Shape();
      let bw = 0.55, bd = 0.48, hw = 0.4, hh = 0.45;
      if (type === 'cervical') { bw=0.5; bd=0.4; hw=0.45; hh=0.5; }
      if (type === 'lumbar') { bw=0.7; bd=0.6; hw=0.42; hh=0.5; }
      
      s.moveTo(-bw, -bd*0.7);
      s.bezierCurveTo(-bw-0.15, -bd*0.85, -bw-0.2, bd*0.85, -bw, bd*0.7);
      s.lineTo(-bw*0.85, bd*0.85);
      s.bezierCurveTo(-bw*0.7, bd*1.15, -0.85, bd*1.25, -1.1, bd*1.0);
      s.lineTo(-1.3, bd*0.35);
      s.bezierCurveTo(-1.4, bd*0.05, -1.3, -bd*0.05, -1.1, -bd*0.4);
      s.lineTo(-0.85, -bd*1.25);
      s.bezierCurveTo(-0.7, -bd*1.15, -bw*0.85, -bd*0.85, -bw, -bd*0.7);
      s.lineTo(bw, -bd*0.7);
      s.bezierCurveTo(bw+0.15, -bd*0.85, bw+0.2, bd*0.85, bw, bd*0.7);
      s.lineTo(bw*0.85, bd*0.85);
      s.bezierCurveTo(bw*0.7, bd*1.15, 0.85, bd*1.25, 1.1, bd*1.0);
      s.lineTo(1.3, bd*0.35);
      s.bezierCurveTo(1.4, bd*0.05, 1.3, -bd*0.05, 1.1, -bd*0.4);
      s.lineTo(0.85, -bd*1.25);
      s.bezierCurveTo(0.7, -bd*1.15, bw*0.85, -bd*0.85, bw, -bd*0.7);
      s.closePath();

      const hole = new THREE.Path();
      hole.moveTo(-hw, -hh);
      hole.bezierCurveTo(-hw-0.05, -hh*0.5, -hw-0.05, hh*0.5, -hw, hh);
      hole.lineTo(hw, hh);
      hole.bezierCurveTo(hw+0.05, hh*0.5, hw+0.05, -hh*0.5, hw, -hh);
      hole.closePath();
      s.holes.push(hole);

      return new THREE.ExtrudeGeometry(s, {
        depth: 0.3,
        bevelEnabled: true,
        bevelThickness: 0.04,
        bevelSize: 0.03,
        bevelSegments: 2
      });
    }

    // ---------- ПОСТРОЕНИЕ ПОЗВОНОЧНИКА ----------
    const spineGroup = new THREE.Group();
    scene.add(spineGroup);

    const total = 24;
    const points = [];
    for (let i = 0; i < total; i++) {
      const t = i / (total - 1);
      const y = i * 0.52;
      let z = 0;
      if (t < 0.35) z = Math.sin((t/0.35)*Math.PI*0.8)*0.95;
      else if (t < 0.7) z = 0.95*Math.cos(((t-0.35)/0.35)*Math.PI*0.7)-0.25;
      else z = -0.25+Math.sin(((t-0.7)/0.3)*Math.PI*0.9)*0.75;
      points.push(new THREE.Vector3(Math.sin(t*Math.PI*2.1)*0.04, y, z));
    }

    const discMat = new THREE.MeshStandardMaterial({ roughness:0.4, color:0xe8d5b2, envMap, transparent:true, opacity:0.9 });
    const nerveMat = new THREE.MeshStandardMaterial({ roughness:0.3, color:0xf5e6a3, emissive:0x332200, emissiveIntensity:0.25, envMap });

    for (let i = 0; i < total; i++) {
      const pos = points[i];
      const type = i < 7 ? 'cervical' : i < 19 ? 'thoracic' : 'lumbar';
      const vert = new THREE.Mesh(createVertebra(type), boneMaterial);
      vert.castShadow = vert.receiveShadow = true;
      vert.position.copy(pos);
      vert.rotation.y = Math.PI;
      spineGroup.add(vert);

      if (i < total - 1) {
        const n = points[i+1];
        const disc = new THREE.Mesh(
          new THREE.CylinderGeometry(type==='lumbar'?0.58:0.48, type==='lumbar'?0.59:0.49, 0.22, 18),
          discMat
        );
        disc.position.set((pos.x+n.x)/2, (pos.y+n.y)/2, (pos.z+n.z)/2);
        disc.castShadow = disc.receiveShadow = true;
        spineGroup.add(disc);
      }
    }

    // Нервы
    const cord = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 80, 0.22, 8, false),
      nerveMat
    );
    cord.castShadow = cord.receiveShadow = true;
    spineGroup.add(cord);

    const rootGeom = new THREE.CylinderGeometry(0.06, 0.06, 0.7, 6);
    for (let i = 0; i < total-1; i++) {
      const pos = points[i].clone().add(new THREE.Vector3(0, -0.1, 0.1));
      [[-0.85, -0.1, 0.2], [0.85, -0.1, 0.2]].forEach(([dx, dy, dz]) => {
        const dir = new THREE.Vector3(dx, dy, dz).normalize();
        const root = new THREE.Mesh(rootGeom, nerveMat);
        root.position.copy(pos.clone().add(dir.clone().multiplyScalar(0.3)));
        root.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
        root.castShadow = root.receiveShadow = true;
        spineGroup.add(root);
      });
    }

    // Крестец + копчик
    const sacrum = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.8, 0.55, 10), boneMaterial);
    sacrum.position.set(0, -0.55, 0.42);
    sacrum.castShadow = sacrum.receiveShadow = true;
    spineGroup.add(sacrum);

    const coccyx = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.65, 7), boneMaterial);
    coccyx.position.set(0, -1.1, 0.52);
    coccyx.rotation.x = 0.2;
    coccyx.castShadow = coccyx.receiveShadow = true;
    spineGroup.add(coccyx);

    // Пол
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(4.5, 32),
      new THREE.MeshStandardMaterial({ color:0x15152a, roughness:0.9, depthWrite:false, transparent:true, opacity:0.25, envMap })
    );
    floor.receiveShadow = true;
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -1.8;
    scene.add(floor);

    // ---------- АНИМАЦИЯ ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Двойной тап
    let lastTap = 0;
    window.addEventListener('touchstart', e => {
      if (Date.now() - lastTap < 300 && e.touches.length === 1) {
        const sP = camera.position.clone(), sT = controls.target.clone();
        const eP = new THREE.Vector3(5, 3.2, 7.5), eT = new THREE.Vector3(0, 2.15, 0);
        requestAnimationFrame(function anim(ts) {
          const t = Math.min((ts-performance.now()+800)/800, 1);
          const ease = 1-Math.pow(1-t, 3);
          camera.position.lerpVectors(sP, eP, ease);
          controls.target.lerpVectors(sT, eT, ease);
          if (t<1) requestAnimationFrame(anim);
        });
      }
      lastTap = Date.now();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

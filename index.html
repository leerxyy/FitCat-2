<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Голографический позвоночник</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000000; font-family: system-ui, sans-serif; }
    #info {
      position: absolute; bottom: 16px; left: 16px; color: rgba(100,180,255,0.9);
      background: rgba(0,20,40,0.5); backdrop-filter: blur(8px); padding: 8px 16px;
      border-radius: 20px; font-size: 13px; pointer-events: none; border: 1px solid rgba(80,160,255,0.3);
    }
  </style>
</head>
<body>
  <div id="info">🦴 Вращай | 🔍 Зум двумя пальцами | Двойной тап — сброс</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- СЦЕНА С ЧЁРНЫМ ФОНОМ ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(4.5, 3, 7);
    camera.lookAt(0, 2.3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false; // голограммам тени не нужны
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    // Управление
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.3, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 1.2;
    controls.minDistance = 2.8;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;
    controls.update();

    controls.addEventListener('start', () => (controls.autoRotate = false));
    controls.addEventListener('end', () => {
      clearTimeout(window.rotTimeout);
      window.rotTimeout = setTimeout(() => (controls.autoRotate = true), 2500);
    });

    // ---------- ГОЛОГРАФИЧЕСКИЙ МАТЕРИАЛ (светящийся голубой) ----------
    const hologramMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.2,
      metalness: 0.1,
      color: new THREE.Color(0x00aaff),
      emissive: new THREE.Color(0x0055cc),
      emissiveIntensity: 1.5,
      transparent: true,
      opacity: 0.85,
    });

    // Материал для дисков (чуть ярче)
    const discHoloMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.15,
      metalness: 0.15,
      color: new THREE.Color(0x44ccff),
      emissive: new THREE.Color(0x0088ee),
      emissiveIntensity: 1.8,
      transparent: true,
      opacity: 0.9,
    });

    // Материал нервов (более яркий)
    const nerveHoloMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.1,
      metalness: 0.0,
      color: new THREE.Color(0x88ddff),
      emissive: new THREE.Color(0x44aaff),
      emissiveIntensity: 2.0,
      transparent: true,
      opacity: 0.95,
    });

    // ---------- ГЕОМЕТРИЯ ПОЗВОНКА ----------
    function createVertebraGeometry(type = 'thoracic') {
      const group = new THREE.Group();

      let bodyRadius, bodyHeight, archWidth, spineLength, transverseLength;
      if (type === 'cervical') {
        bodyRadius = 0.38; bodyHeight = 0.24;
        spineLength = 0.3; transverseLength = 0.45;
      } else if (type === 'thoracic') {
        bodyRadius = 0.48; bodyHeight = 0.28;
        spineLength = 0.5; transverseLength = 0.55;
      } else {
        bodyRadius = 0.6; bodyHeight = 0.32;
        spineLength = 0.65; transverseLength = 0.7;
      }

      // Тело позвонка
      const bodyGeom = new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyHeight, 20);
      const body = new THREE.Mesh(bodyGeom, hologramMaterial);
      group.add(body);

      // Дуга (проволочная для голографического эффекта)
      const archGeom = new THREE.TorusGeometry(bodyRadius * 0.65, 0.04, 8, 16, Math.PI);
      const arch = new THREE.Mesh(archGeom, hologramMaterial);
      arch.position.z = -bodyRadius * 0.15;
      arch.rotation.x = Math.PI / 2;
      arch.rotation.z = Math.PI;
      group.add(arch);

      // Остистый отросток
      const spineGeom = new THREE.ConeGeometry(0.06, spineLength, 8, 4);
      const spine = new THREE.Mesh(spineGeom, hologramMaterial);
      spine.position.z = -bodyRadius - spineLength * 0.35;
      spine.rotation.x = Math.PI / 2;
      group.add(spine);

      // Поперечные отростки
      [-1, 1].forEach(side => {
        const transGeom = new THREE.CylinderGeometry(0.04, 0.04, transverseLength, 8);
        const trans = new THREE.Mesh(transGeom, hologramMaterial);
        trans.position.x = side * (bodyRadius + transverseLength * 0.3);
        trans.position.z = -bodyRadius * 0.1;
        trans.rotation.z = Math.PI / 2;
        group.add(trans);
      });

      return group;
    }

    // ---------- ПОСТРОЕНИЕ ПОЗВОНОЧНИКА С ПРАВИЛЬНЫМИ ИЗГИБАМИ ----------
    const spineGroup = new THREE.Group();
    scene.add(spineGroup);

    const totalVertebrae = 24; // 7 шейных + 12 грудных + 5 поясничных
    const vertSpacing = 0.56;

    // Точки кривой с анатомически правильными изгибами
    const curvePoints = [];
    for (let i = 0; i < totalVertebrae; i++) {
      const t = i / (totalVertebrae - 1); // 0 = C1 (верх), 1 = L5 (низ)
      const y = i * vertSpacing;
      
      let z = 0;
      
      if (t < 0.29) {
        // Шейный отдел (C1-C7): лордоз — изгиб ВПЕРЁД (положительный Z)
        const cervicalT = t / 0.29;
        z = Math.sin(cervicalT * Math.PI * 0.85) * 0.65;
      } else if (t < 0.79) {
        // Грудной отдел (T1-T12): кифоз — изгиб НАЗАД (отрицательный Z)
        const thoracicT = (t - 0.29) / 0.5;
        // Плавный переход от +0.2 к -0.75 и обратно к -0.1
        z = 0.2 * Math.cos(thoracicT * Math.PI * 0.3) - 
            0.75 * Math.sin(thoracicT * Math.PI * 0.85);
      } else {
        // Поясничный отдел (L1-L5): лордоз — изгиб ВПЕРЁД (положительный Z)
        const lumbarT = (t - 0.79) / 0.21;
        z = -0.1 + Math.sin(lumbarT * Math.PI * 0.9) * 0.7;
      }
      
      // Минимальное боковое смещение для естественности
      const x = Math.sin(t * Math.PI * 1.8) * 0.02;
      
      curvePoints.push(new THREE.Vector3(x, y, z));
    }

    // Создаём позвонки и диски
    for (let i = 0; i < totalVertebrae; i++) {
      const pos = curvePoints[i];
      const type = i < 7 ? 'cervical' : i < 19 ? 'thoracic' : 'lumbar';
      const vertebraGroup = createVertebraGeometry(type);
      vertebraGroup.position.copy(pos);
      vertebraGroup.rotation.y = Math.PI;
      spineGroup.add(vertebraGroup);

      // Межпозвонковый диск
      if (i < totalVertebrae - 1) {
        const nextPos = curvePoints[i + 1];
        const discY = (pos.y + nextPos.y) / 2;
        const discZ = (pos.z + nextPos.z) / 2;
        const discX = (pos.x + nextPos.x) / 2;
        const discRadius = type === 'lumbar' ? 0.58 : type === 'cervical' ? 0.36 : 0.46;
        const discGeom = new THREE.CylinderGeometry(discRadius, discRadius * 1.03, 0.18, 20);
        const disc = new THREE.Mesh(discGeom, discHoloMaterial);
        disc.position.set(discX, discY, discZ);
        spineGroup.add(disc);
      }
    }

    // ---------- НЕРВНАЯ СИСТЕМА ----------
    const spinalCurve = new THREE.CatmullRomCurve3(curvePoints);
    const cordGeom = new THREE.TubeGeometry(spinalCurve, 100, 0.18, 10, false);
    const spinalCord = new THREE.Mesh(cordGeom, nerveHoloMaterial);
    spineGroup.add(spinalCord);

    // Нервные корешки
    const rootGeom = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 6);
    for (let i = 0; i < totalVertebrae - 1; i++) {
      const pos = curvePoints[i].clone();
      pos.z -= 0.08;
      pos.y -= 0.04;

      const directions = [
        new THREE.Vector3(-0.8, -0.15, 0.15).normalize(),
        new THREE.Vector3(0.8, -0.15, 0.15).normalize(),
      ];

      directions.forEach(dir => {
        const root = new THREE.Mesh(rootGeom, nerveHoloMaterial);
        root.position.copy(pos.clone().add(dir.clone().multiplyScalar(0.35)));
        root.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        spineGroup.add(root);
      });
    }

    // Крестец и копчик
    const sacrumGeom = new THREE.CylinderGeometry(0.55, 0.7, 0.5, 10);
    const sacrum = new THREE.Mesh(sacrumGeom, hologramMaterial);
    sacrum.position.set(0, -0.5, 0.3);
    sacrum.rotation.x = 0.3;
    spineGroup.add(sacrum);

    const coccyxGeom = new THREE.ConeGeometry(0.35, 0.6, 8);
    const coccyx = new THREE.Mesh(coccyxGeom, hologramMaterial);
    coccyx.position.set(0, -1.0, 0.4);
    coccyx.rotation.x = 0.5;
    spineGroup.add(coccyx);

    // ---------- СВЕТЯЩИЕСЯ ЧАСТИЦЫ ВОКРУГ ПОЗВОНОЧНИКА ----------
    const particlesGeom = new THREE.BufferGeometry();
    const particlesCount = 300;
    const particlesPositions = new Float32Array(particlesCount * 3);
    
    for (let i = 0; i < particlesCount; i++) {
      const t = Math.random();
      const pointOnCurve = spinalCurve.getPoint(t);
      particlesPositions[i * 3] = pointOnCurve.x + (Math.random() - 0.5) * 2;
      particlesPositions[i * 3 + 1] = pointOnCurve.y + (Math.random() - 0.5) * 2;
      particlesPositions[i * 3 + 2] = pointOnCurve.z + (Math.random() - 0.5) * 2;
    }
    
    particlesGeom.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
    
    const particlesMat = new THREE.PointsMaterial({
      color: 0x66ccff,
      size: 0.03,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.6,
    });
    
    const particles = new THREE.Points(particlesGeom, particlesMat);
    spineGroup.add(particles);

    // ---------- ЛЁГКОЕ СВЕЧЕНИЕ ВОКРУГ МОДЕЛИ ----------
    const glowGeom = new THREE.SphereGeometry(2.5, 32, 32);
    const glowMat = new THREE.ShaderMaterial({
      uniforms: {},
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          float intensity = pow(0.7 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
          gl_FragColor = vec4(0.2, 0.5, 1.0, intensity * 0.15);
        }
      `,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
    });
    const glowSphere = new THREE.Mesh(glowGeom, glowMat);
    glowSphere.position.set(0, 2.3, 0);
    scene.add(glowSphere);

    // ---------- АНИМАЦИЯ ----------
    function animate() {
      requestAnimationFrame(animate);
      
      // Лёгкое мерцание частиц
      particles.rotation.y += 0.0005;
      particles.rotation.x += 0.0002;
      
      // Пульсация свечения
      const time = Date.now() * 0.001;
      particlesMat.opacity = 0.4 + Math.sin(time * 2) * 0.2;
      
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Двойной тап — сброс камеры
    let lastTap = 0;
    window.addEventListener('touchstart', e => {
      if (Date.now() - lastTap < 300 && e.touches.length === 1) {
        const sP = camera.position.clone();
        const sT = controls.target.clone();
        const eP = new THREE.Vector3(4.5, 3, 7);
        const eT = new THREE.Vector3(0, 2.3, 0);
        const st = performance.now();
        function anim(ts) {
          const t = Math.min((ts - st) / 800, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(sP, eP, ease);
          controls.target.lerpVectors(sT, eT, ease);
          if (t < 1) requestAnimationFrame(anim);
        }
        requestAnimationFrame(anim);
      }
      lastTap = Date.now();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

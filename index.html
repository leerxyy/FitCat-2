<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Гиперреалистичный 3D позвоночник</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: pan-x pan-y pinch-zoom; /* для жестов */
            background: #0a0a14;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-size: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            transition: opacity 0.8s;
            pointer-events: none;
        }
        #info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">🦴 Загрузка модели...</div>
    <div id="info">🖐️ Вращай | 🔍 Два пальца – зум</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ---- Сцена, камера, рендерер ----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b1a);
        // Легкий туман для глубины
        scene.fog = new THREE.Fog(0x0b0b1a, 5, 18);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );
        camera.position.set(5, 3.5, 7);
        camera.lookAt(0, 2.2, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // щадим телефон
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Управление
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.rotateSpeed = 0.7;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.5;
        controls.minDistance = 3.5;
        controls.maxDistance = 15;
        controls.maxPolarAngle = Math.PI; // можно снизу смотреть
        controls.update();

        // Авто-вращение, которое засыпает при касании
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;
        controls.addEventListener('start', () => { controls.autoRotate = false; });
        controls.addEventListener('end', () => {
            // Возобновить авто-вращение через 2 секунды бездействия
            clearTimeout(window.autoRotateTimeout);
            window.autoRotateTimeout = setTimeout(() => {
                controls.autoRotate = true;
            }, 2000);
        });

        // ---- Освещение (студийная схема) ----
        // Окружающий свет, чтобы тени не были абсолютно чёрными
        const ambient = new THREE.AmbientLight(0x2a2a4a);
        scene.add(ambient);

        // Ключевой свет (с теплым оттенком)
        const keyLight = new THREE.DirectionalLight(0xffeedd, 1.3);
        keyLight.position.set(5, 10, 8);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 30;
        keyLight.shadow.camera.left = -8;
        keyLight.shadow.camera.right = 8;
        keyLight.shadow.camera.top = 8;
        keyLight.shadow.camera.bottom = -8;
        keyLight.shadow.bias = -0.0001;
        keyLight.shadow.normalBias = 0.02;
        scene.add(keyLight);

        // Заполняющий свет (холодный)
        const fillLight = new THREE.DirectionalLight(0xccddff, 0.7);
        fillLight.position.set(-4, 2, -2);
        scene.add(fillLight);

        // Контровой свет (для блеска граней)
        const rimLight = new THREE.DirectionalLight(0xffccaa, 0.6);
        rimLight.position.set(-2, 5, -5);
        scene.add(rimLight);

        // Подсветка снизу
        const bottomLight = new THREE.DirectionalLight(0x4466aa, 0.4);
        bottomLight.position.set(0, -1, 1);
        scene.add(bottomLight);

        // ---- Генерация текстур кости (Canvas) ----
        function createBoneTexture(size = 512) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Базовый цвет кости (слоновая кость)
            const baseR = 227, baseG = 201, baseB = 168;
            const imageData = ctx.createImageData(size, size);
            const data = imageData.data;

            // Параметры шума
            const scale = 8;        // размер зерна
            const contrast = 18;    // разброс цвета
            const poreDensity = 0.03; // плотность пор
            const crackProb = 0.002;  // микротрещины

            // Заполняем пиксели с шумом
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = (y * size + x) * 4;

                    // Шум на основе синусов (псевдослучайная, но детерминированная)
                    const nx = x / scale;
                    const ny = y / scale;
                    const noiseVal = Math.sin(nx * 12.9898 + ny * 78.233) * 43758.5453 % 1;
                    // Добавляем несколько октав для натуральности
                    const noise2 = Math.sin(nx * 27.17 + ny * 39.64) * 25421.631 % 1;
                    const noise3 = Math.sin(nx * 63.21 + ny * 12.78) * 19283.471 % 1;
                    const combinedNoise = (noiseVal * 0.6 + noise2 * 0.3 + noise3 * 0.1);

                    // Вариация цвета в пределах оттенка
                    const r = baseR + (combinedNoise - 0.5) * contrast * 2;
                    const g = baseG + (combinedNoise - 0.5) * contrast * 2;
                    const b = baseB + (combinedNoise - 0.5) * contrast * 2;

                    // Добавляем случайные тёмные поры
                    let finalR = r, finalG = g, finalB = b;
                    if (Math.random() < poreDensity) {
                        const darkness = 0.3 + Math.random() * 0.4;
                        finalR = r * darkness;
                        finalG = g * darkness;
                        finalB = b * darkness;
                    }
                    // Микротрещины (очень тонкие тёмные линии)
                    if (Math.random() < crackProb) {
                        const crackDarkness = 0.2;
                        finalR = r * crackDarkness;
                        finalG = g * crackDarkness;
                        finalB = b * crackDarkness;
                    }

                    data[idx] = Math.min(255, Math.max(0, Math.round(finalR)));
                    data[idx+1] = Math.min(255, Math.max(0, Math.round(finalG)));
                    data[idx+2] = Math.min(255, Math.max(0, Math.round(finalB)));
                    data[idx+3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);

            // Добавляем лёгкие слоистые линии (ростовые слои)
            ctx.strokeStyle = 'rgba(180,150,110,0.08)';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < size; i += 12 + Math.floor(Math.random()*8)) {
                ctx.beginPath();
                ctx.moveTo(0, i + Math.sin(i*0.2)*3);
                for (let x = 0; x < size; x+=4) {
                    ctx.lineTo(x, i + Math.sin(i*0.2 + x*0.01)*4);
                }
                ctx.stroke();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Генерация карты неровностей (bump) из той же текстуры через яркость
        function createBumpMap(colorTexture, strength = 0.04) {
            const canvas = document.createElement('canvas');
            canvas.width = colorTexture.image.width;
            canvas.height = colorTexture.image.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(colorTexture.image, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            // Переводим в оттенки серого (яркость) – это и будет высота
            for (let i = 0; i < data.length; i += 4) {
                const gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                data[i] = gray;
                data[i+1] = gray;
                data[i+2] = gray;
                // Альфа не меняем
            }
            ctx.putImageData(imageData, 0, 0);
            const bumpTexture = new THREE.CanvasTexture(canvas);
            bumpTexture.wrapS = THREE.RepeatWrapping;
            bumpTexture.wrapT = THREE.RepeatWrapping;
            return bumpTexture;
        }

        // Создаём текстуры
        const boneColorTex = createBoneTexture(512);
        boneColorTex.wrapS = THREE.RepeatWrapping;
        boneColorTex.wrapT = THREE.RepeatWrapping;
        boneColorTex.repeat.set(2, 2); // повторяем для позвонка

        const boneBumpTex = createBumpMap(boneColorTex, 0.03);
        boneBumpTex.wrapS = THREE.RepeatWrapping;
        boneBumpTex.wrapT = THREE.RepeatWrapping;
        boneBumpTex.repeat.set(2, 2);

        // Материал кости (PBR)
        const boneMaterial = new THREE.MeshStandardMaterial({
            map: boneColorTex,
            bumpMap: boneBumpTex,
            bumpScale: 0.12,
            roughness: 0.55,
            metalness: 0.05,
            color: 0xffffff, // умножается на текстуру
            emissive: new THREE.Color(0x000000)
        });

        // Материал для дисков (фиброзный хрящ)
        const discCanvas = document.createElement('canvas');
        discCanvas.width = 256;
        discCanvas.height = 256;
        const dctx = discCanvas.getContext('2d');
        dctx.fillStyle = '#e6d5b8';
        dctx.fillRect(0,0,256,256);
        // шум
        const discImageData = dctx.createImageData(256,256);
        const dd = discImageData.data;
        for (let i=0; i<dd.length; i+=4) {
            const noise = (Math.sin(i*0.002)*0.5+0.5)*15;
            dd[i] = 230 + noise;
            dd[i+1] = 213 + noise;
            dd[i+2] = 184 + noise;
            dd[i+3] = 255;
        }
        dctx.putImageData(discImageData,0,0);
        const discTex = new THREE.CanvasTexture(discCanvas);
        discTex.wrapS = THREE.RepeatWrapping;
        discTex.wrapT = THREE.RepeatWrapping;

        const discMaterial = new THREE.MeshStandardMaterial({
            map: discTex,
            roughness: 0.4,
            metalness: 0.1,
            color: 0xffffff,
            bumpMap: discTex,
            bumpScale: 0.05,
            transparent: true,
            opacity: 0.92
        });

        // ---- Построение геометрии позвонка (экструзия по профилю) ----
        function createVertebraShape() {
            const shape = new THREE.Shape();
            // Параметры в мм * 10 для масштаба, примерно 1 единица = 1 см.
            // Тело позвонка: эллипс, ширина 1.3, глубина 1.0
            const bodyW = 0.65;  // полуширина
            const bodyD = 0.5;   // полуглубина

            // Рисуем внешний контур (вид сверху): тело + отростки
            shape.moveTo(-bodyW, -bodyD*0.6);
            shape.bezierCurveTo(-bodyW-0.2, -bodyD*0.8, -bodyW-0.25, bodyD*0.8, -bodyW, bodyD*0.6);
            shape.lineTo(-bodyW*0.9, bodyD*0.9);
            // Правый поперечный отросток
            shape.bezierCurveTo(-bodyW*0.8, bodyD*1.2, -0.9, bodyD*1.3, -1.2, bodyD*1.0);
            shape.lineTo(-1.35, bodyD*0.4);
            shape.bezierCurveTo(-1.45, bodyD*0.1, -1.35, -bodyD*0.1, -1.2, -bodyD*0.4);
            shape.lineTo(-0.9, -bodyD*1.3);
            shape.bezierCurveTo(-0.8, -bodyD*1.2, -bodyW*0.9, -bodyD*0.9, -bodyW, -bodyD*0.6);
            
            // Правый бок
            shape.lineTo(bodyW, -bodyD*0.6);
            shape.bezierCurveTo(bodyW+0.2, -bodyD*0.8, bodyW+0.25, bodyD*0.8, bodyW, bodyD*0.6);
            shape.lineTo(bodyW*0.9, bodyD*0.9);
            // Левый поперечный отросток
            shape.bezierCurveTo(bodyW*0.8, bodyD*1.2, 0.9, bodyD*1.3, 1.2, bodyD*1.0);
            shape.lineTo(1.35, bodyD*0.4);
            shape.bezierCurveTo(1.45, bodyD*0.1, 1.35, -bodyD*0.1, 1.2, -bodyD*0.4);
            shape.lineTo(0.9, -bodyD*1.3);
            shape.bezierCurveTo(0.8, -bodyD*1.2, bodyW*0.9, -bodyD*0.9, bodyW, -bodyD*0.6);
            shape.closePath();

            // Остистый отросток (сзади) - добавим выступ
            const holePath = new THREE.Path();
            holePath.moveTo(-0.25, -0.3);
            holePath.lineTo(-0.25, 0.3);
            holePath.lineTo(0.25, 0.3);
            holePath.lineTo(0.25, -0.3);
            holePath.closePath();
            shape.holes.push(holePath);

            // Позвоночное отверстие
            const spinalHole = new THREE.Path();
            const holeW = 0.35;
            const holeH = 0.4;
            spinalHole.moveTo(-holeW, -holeH);
            spinalHole.bezierCurveTo(-holeW-0.1, -holeH*0.5, -holeW-0.1, holeH*0.5, -holeW, holeH);
            spinalHole.lineTo(holeW, holeH);
            spinalHole.bezierCurveTo(holeW+0.1, holeH*0.5, holeW+0.1, -holeH*0.5, holeW, -holeH);
            spinalHole.closePath();
            shape.holes.push(spinalHole);

            return shape;
        }

        const vertebraShape = createVertebraShape();
        const extrudeSettings = {
            depth: 0.32,        // высота позвонка
            bevelEnabled: true,
            bevelThickness: 0.04,
            bevelSize: 0.03,
            bevelSegments: 2
        };
        const vertebraGeometry = new THREE.ExtrudeGeometry(vertebraShape, extrudeSettings);
        // Смещаем геометрию так, чтобы центр масс был в геометрическом центре
        vertebraGeometry.center();

        // ---- Сборка позвоночника ----
        const spineGroup = new THREE.Group();
        scene.add(spineGroup);

        const vertebraeCount = 18;
        const discThickness = 0.2;
        const vertebraHeight = 0.32;
        const gap = vertebraHeight + discThickness;

        for (let i = 0; i < vertebraeCount; i++) {
            const t = i / (vertebraeCount - 1);
            const y = i * gap;

            // S-изгиб
            let zOffset = 0;
            if (t < 0.35) {
                zOffset = Math.sin((t / 0.35) * Math.PI * 0.8) * 0.95;
            } else if (t < 0.7) {
                const lt = (t - 0.35) / 0.35;
                zOffset = 0.95 * Math.cos(lt * Math.PI * 0.7) - 0.25;
            } else {
                const lt = (t - 0.7) / 0.3;
                zOffset = -0.25 + Math.sin(lt * Math.PI * 0.9) * 0.75;
            }
            const xOffset = Math.sin(t * Math.PI * 2.2) * 0.04;

            // Позвонок
            const vertebra = new THREE.Mesh(vertebraGeometry, boneMaterial);
            vertebra.castShadow = true;
            vertebra.receiveShadow = true;
            vertebra.position.set(xOffset, y, zOffset);
            // Повернуть так, чтобы остистый отросток смотрел назад (Z-)
            vertebra.rotation.y = Math.PI; // профиль ориентирован, поправим если надо
            spineGroup.add(vertebra);

            // Диск между позвонками
            if (i < vertebraeCount - 1) {
                const nextT = (i+1)/(vertebraeCount-1);
                let nextZ = 0;
                if (nextT < 0.35) nextZ = Math.sin((nextT/0.35)*Math.PI*0.8)*0.95;
                else if (nextT < 0.7) nextZ = 0.95*Math.cos(((nextT-0.35)/0.35)*Math.PI*0.7)-0.25;
                else nextZ = -0.25 + Math.sin(((nextT-0.7)/0.3)*Math.PI*0.9)*0.75;
                const discY = y + gap/2;
                const discZ = (zOffset + nextZ)/2;
                const discX = (xOffset + Math.sin(nextT*Math.PI*2.2)*0.04)/2;

                const discGeom = new THREE.CylinderGeometry(0.52, 0.55, discThickness, 20);
                const disc = new THREE.Mesh(discGeom, discMaterial);
                disc.castShadow = true;
                disc.receiveShadow = true;
                disc.position.set(discX, discY, discZ);
                disc.rotation.x = 0;
                spineGroup.add(disc);
            }
        }

        // Крестец и копчик (упрощённые)
        const sacrumGeom = new THREE.CylinderGeometry(0.7, 0.9, 0.6, 12);
        const sacrum = new THREE.Mesh(sacrumGeom, boneMaterial);
        sacrum.castShadow = true;
        sacrum.receiveShadow = true;
        sacrum.position.set(0, -0.55, 0.4);
        spineGroup.add(sacrum);

        const coccyxGeom = new THREE.ConeGeometry(0.45, 0.7, 8);
        const coccyx = new THREE.Mesh(coccyxGeom, boneMaterial);
        coccyx.castShadow = true;
        coccyx.receiveShadow = true;
        coccyx.position.set(0, -1.15, 0.5);
        coccyx.rotation.x = 0.25;
        spineGroup.add(coccyx);

        // Подставка (прозрачная)
        const floorGeom = new THREE.CircleGeometry(4, 32);
        const floorMat = new THREE.MeshPhongMaterial({
            color: 0x1a1a3a,
            depthWrite: false,
            opacity: 0.2,
            transparent: true
        });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.receiveShadow = true;
        floor.rotation.x = -Math.PI/2;
        floor.position.y = -1.9;
        scene.add(floor);

        // ---- Анимация ----
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Убираем загрузку
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => {
            const el = document.getElementById('loading');
            if (el) el.style.display = 'none';
        }, 1000);

        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Двойной тап для сброса камеры (удобно на телефоне)
        let lastTap = 0;
        window.addEventListener('touchstart', (e) => {
            const now = Date.now();
            if (now - lastTap < 300 && e.touches.length === 1) {
                // Двойной тап — плавно вернуть камеру
                gsapTo(camera.position, {x: 5, y: 3.5, z: 7});
                gsapTo(controls.target, {x: 0, y: 2.2, z: 0});
            }
            lastTap = now;
        });

        function gsapTo(obj, props) {
            const start = {};
            for (let p in props) start[p] = obj[p];
            const duration = 1000;
            const startTime = performance.now();
            function update() {
                const now = performance.now();
                const t = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3); // ease-out
                for (let p in props) {
                    obj[p] = start[p] + (props[p] - start[p]) * ease;
                }
                if (t < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }
    </script>
</body>
</html>

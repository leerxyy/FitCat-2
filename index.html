<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Позвоночник 1:1 — гиперреализм</title>
  <style>
    body { margin:0; overflow:hidden; background:#050510; touch-action: pan-x pan-y pinch-zoom; }
    #info {
      position:absolute; bottom:12px; left:12px; color:rgba(255,255,255,0.7);
      background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); padding:5px 14px;
      border-radius:20px; font-size:12px; pointer-events:none;
    }
  </style>
</head>
<body>
  <div id="info">🦴 Вращай | 🔍 Зум двумя пальцами | Двойной тап — сброс</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- Базовые настройки ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060f);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 50);
    camera.position.set(5, 3.2, 7.5);
    camera.lookAt(0, 2.2, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true, 
      powerPreference: "high-performance" 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // Управление с авто-возвратом после бездействия
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 1.1;
    controls.minDistance = 3.2;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI;
    controls.update();

    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.addEventListener('start', () => { controls.autoRotate = false; });
    controls.addEventListener('end', () => {
      clearTimeout(window.autoRotateTimeout);
      window.autoRotateTimeout = setTimeout(() => { controls.autoRotate = true; }, 2500);
    });

    // ---------- HDR окружение (сгенерированное) ----------
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    // Создаём сцену с градиентным небом для запекания окружения
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x0a0a1a);
    const envGeo = new THREE.SphereGeometry(10, 32, 32);
    const envMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {},
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        void main() {
          float y = normalize(vWorldPos).y;
          float t = smoothstep(-0.2, 0.6, y);
          vec3 bottom = vec3(0.02, 0.02, 0.08);
          vec3 top = vec3(0.55, 0.65, 0.9);
          vec3 col = mix(bottom, top, t);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const envSphere = new THREE.Mesh(envGeo, envMat);
    envScene.add(envSphere);
    const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
    scene.environment = envMap;
    scene.background = new THREE.Color(0x050510); // чуть темнее фона

    // ---------- Освещение ----------
    const ambient = new THREE.AmbientLight(0x334466);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffeedd, 1.4);
    keyLight.position.set(6, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.bias = -0.00015;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xccddff, 0.65);
    fillLight.position.set(-4, 1, -3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffccaa, 0.55);
    rimLight.position.set(-1, 6, -6);
    scene.add(rimLight);

    // ---------- Генераторы текстур ----------
    function createBoneTexture(size=512) {
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const d = imgData.data;
      for (let i=0; i<d.length; i+=4) {
        const x = (i/4)%size, y = Math.floor((i/4)/size);
        const nx = x/6.0, ny = y/6.0;
        const n1 = Math.sin(nx*12.9898+ny*78.233)*43758.5453%1;
        const n2 = Math.sin(nx*27.17+ny*39.64)*25421.631%1;
        const n3 = Math.sin(nx*63.21+ny*12.78)*19283.471%1;
        const noise = n1*0.55 + n2*0.3 + n3*0.15;
        const r = 220 + (noise-0.5)*28;
        const g = 195 + (noise-0.5)*25;
        const b = 165 + (noise-0.5)*23;
        d[i]=Math.min(255,Math.max(0,r));
        d[i+1]=Math.min(255,Math.max(0,g));
        d[i+2]=Math.min(255,Math.max(0,b));
        d[i+3]=255;
      }
      ctx.putImageData(imgData,0,0);
      return new THREE.CanvasTexture(canvas);
    }

    const boneTex = createBoneTexture(512);
    boneTex.wrapS = THREE.RepeatWrapping;
    boneTex.wrapT = THREE.RepeatWrapping;
    boneTex.repeat.set(2,2);

    // ---------- SSS шейдер для кости ----------
    const boneSSSMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: boneTex },
        lightDirection: { value: new THREE.Vector3(0.5, 0.8, 0.6).normalize() },
        ambientColor: { value: new THREE.Color(0x334466) },
        diffuseColor: { value: new THREE.Color(0xede0cc) },
        sssColor: { value: new THREE.Color(0xff9944) },
        sssWidth: { value: 0.45 },
        envMap: { value: envMap },
        roughness: { value: 0.55 },
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          vNormal = normalize(mat3(modelMatrix) * normal);
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewDir = normalize(-mvPosition.xyz);
          vUv = uv;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        uniform sampler2D map;
        uniform vec3 lightDirection;
        uniform vec3 ambientColor;
        uniform vec3 diffuseColor;
        uniform vec3 sssColor;
        uniform float sssWidth;
        uniform samplerCube envMap;
        uniform float roughness;

        void main() {
          vec3 N = normalize(vNormal);
          vec3 V = normalize(vViewDir);
          vec3 L = normalize(lightDirection);

          // Diffuse
          float NdotL = max(0.0, dot(N, L));
          float NdotV = max(0.0, dot(N, V));

          // Subsurface scattering approximation (based on view angle)
          float sss = max(0.0, dot(V, -L)) * (1.0 - NdotL) * sssWidth;
          sss *= smoothstep(0.0, 1.0, NdotV); // fade at glancing angles

          // Base texture
          vec4 texColor = texture2D(map, vUv);
          vec3 albedo = texColor.rgb * diffuseColor;

          // Ambient
          vec3 ambient = albedo * ambientColor * 0.7;

          // Diffuse lighting
          vec3 diffuse = albedo * NdotL * 1.1;

          // SSS contribution
          vec3 sssContribution = sssColor * sss * 0.8;

          // Simple specular (environment reflection)
          vec3 R = reflect(-V, N);
          vec3 envColor = textureCube(envMap, R).rgb;
          float fresnel = pow(1.0 - NdotV, 3.0);
          vec3 specular = mix(vec3(0.04), albedo, fresnel) * envColor * (1.0 - roughness);

          vec3 finalColor = ambient + diffuse + sssContribution + specular * 0.6;
          finalColor = finalColor / (finalColor + vec3(1.0)); // simple tonemap
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      lights: true,
    });

    // Материал для дисков (чуть полупрозрачный)
    const discMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.35,
      metalness: 0.08,
      color: 0xe8d5b2,
      emissive: new THREE.Color(0x110c06),
      transparent: true,
      opacity: 0.9,
      envMap: envMap,
      envMapIntensity: 0.7,
    });

    // Материал для нервов
    const nerveMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.3,
      metalness: 0.0,
      color: 0xf5e6a3,
      emissive: new THREE.Color(0x332200),
      emissiveIntensity: 0.25,
      envMap: envMap,
      envMapIntensity: 0.5,
    });

    // ---------- Геометрия позвонков по отделам ----------
    function createVertebraShape(type='cervical') {
      const s = new THREE.Shape();
      let bw, bd, holeW, holeH, procLen;
      if (type === 'cervical') {
        bw=0.5; bd=0.4; holeW=0.45; holeH=0.5; procLen=0.35;
      } else if (type === 'thoracic') {
        bw=0.55; bd=0.48; holeW=0.4; holeH=0.45; procLen=0.5;
      } else { // lumbar
        bw=0.7; bd=0.6; holeW=0.42; holeH=0.5; procLen=0.65;
      }

      const bodyW = bw, bodyD = bd;
      s.moveTo(-bodyW, -bodyD*0.7);
      s.bezierCurveTo(-bodyW-0.15, -bodyD*0.85, -bodyW-0.2, bodyD*0.85, -bodyW, bodyD*0.7);
      s.lineTo(-bodyW*0.85, bodyD*0.85);
      s.bezierCurveTo(-bodyW*0.7, bodyD*1.15, -0.85, bodyD*1.25, -1.1, bodyD*1.0);
      s.lineTo(-1.3, bodyD*0.35);
      s.bezierCurveTo(-1.4, bodyD*0.05, -1.3, -bodyD*0.05, -1.1, -bodyD*0.4);
      s.lineTo(-0.85, -bodyD*1.25);
      s.bezierCurveTo(-0.7, -bodyD*1.15, -bodyW*0.85, -bodyD*0.85, -bodyW, -bodyD*0.7);
      s.lineTo(bodyW, -bodyD*0.7);
      s.bezierCurveTo(bodyW+0.15, -bodyD*0.85, bodyW+0.2, bodyD*0.85, bodyW, bodyD*0.7);
      s.lineTo(bodyW*0.85, bodyD*0.85);
      s.bezierCurveTo(bodyW*0.7, bodyD*1.15, 0.85, bodyD*1.25, 1.1, bodyD*1.0);
      s.lineTo(1.3, bodyD*0.35);
      s.bezierCurveTo(1.4, bodyD*0.05, 1.3, -bodyD*0.05, 1.1, -bodyD*0.4);
      s.lineTo(0.85, -bodyD*1.25);
      s.bezierCurveTo(0.7, -bodyD*1.15, bodyW*0.85, -bodyD*0.85, bodyW, -bodyD*0.7);
      s.closePath();

      const hole = new THREE.Path();
      hole.moveTo(-holeW, -holeH);
      hole.bezierCurveTo(-holeW-0.05, -holeH*0.5, -holeW-0.05, holeH*0.5, -holeW, holeH);
      hole.lineTo(holeW, holeH);
      hole.bezierCurveTo(holeW+0.05, holeH*0.5, holeW+0.05, -holeH*0.5, holeW, -holeH);
      hole.closePath();
      s.holes.push(hole);

      return new THREE.ExtrudeGeometry(s, {
        depth: 0.3,
        bevelEnabled: true,
        bevelThickness: 0.04,
        bevelSize: 0.03,
        bevelSegments: 2
      });
    }

    // ---------- Построение позвоночника ----------
    const spineGroup = new THREE.Group();
    scene.add(spineGroup);

    const totalVertebrae = 24; // 7+12+5
    const discHeight = 0.22;
    const vertHeight = 0.3;
    const gap = vertHeight + discHeight;

    // Изгибы
    const curvePoints = [];
    for (let i=0; i<totalVertebrae; i++) {
      const t = i/(totalVertebrae-1);
      const y = i * gap;
      let z = 0;
      if (t < 0.35) z = Math.sin((t/0.35)*Math.PI*0.8)*0.95;
      else if (t < 0.7) z = 0.95*Math.cos(((t-0.35)/0.35)*Math.PI*0.7)-0.25;
      else z = -0.25+Math.sin(((t-0.7)/0.3)*Math.PI*0.9)*0.75;
      const x = Math.sin(t*Math.PI*2.1)*0.04;
      curvePoints.push(new THREE.Vector3(x, y, z));
    }

    // Тип позвонка
    const getType = (i) => {
      if (i < 7) return 'cervical';
      if (i < 19) return 'thoracic';
      return 'lumbar';
    };

    for (let i=0; i<totalVertebrae; i++) {
      const pos = curvePoints[i];
      const type = getType(i);
      const geom = createVertebraShape(type);
      const vertebra = new THREE.Mesh(geom, boneSSSMaterial);
      vertebra.castShadow = true;
      vertebra.receiveShadow = true;
      vertebra.position.copy(pos);
      vertebra.rotation.y = Math.PI; // остистый отросток назад
      spineGroup.add(vertebra);

      // Диск
      if (i < totalVertebrae-1) {
        const nextPos = curvePoints[i+1];
        const midY = (pos.y + nextPos.y)/2;
        const midZ = (pos.z + nextPos.z)/2;
        const midX = (pos.x + nextPos.x)/2;
        const discRadius = type==='lumbar'?0.58:0.48;
        const discGeom = new THREE.CylinderGeometry(discRadius, discRadius*1.02, discHeight, 18);
        const disc = new THREE.Mesh(discGeom, discMaterial);
        disc.castShadow = true;
        disc.receiveShadow = true;
        disc.position.set(midX, midY, midZ);
        spineGroup.add(disc);
      }
    }

    // ---------- Нервная система ----------
    // Спинной мозг вдоль всего позвоночного канала
    const spinalCurve = new THREE.CatmullRomCurve3(curvePoints);
    const spinalTubeGeom = new THREE.TubeGeometry(spinalCurve, 80, 0.22, 8, false);
    const spinalCord = new THREE.Mesh(spinalTubeGeom, nerveMaterial);
    spinalCord.castShadow = true;
    spinalCord.receiveShadow = true;
    spineGroup.add(spinalCord);

    // Нервные корешки (из каждого позвонка, кроме последних)
    const rootGeomTemplate = new THREE.CylinderGeometry(0.06, 0.06, 0.7, 6);
    for (let i=0; i<totalVertebrae-1; i++) {
      const pos = curvePoints[i];
      // Левый и правый корешок
      const dirLeft = new THREE.Vector3(-0.85, -0.1, 0.2).normalize();
      const dirRight = new THREE.Vector3(0.85, -0.1, 0.2).normalize();
      const start = pos.clone().add(new THREE.Vector3(0, -0.1, 0.1));
      
      const leftRoot = new THREE.Mesh(rootGeomTemplate, nerveMaterial);
      leftRoot.position.copy(start.clone().add(dirLeft.clone().multiplyScalar(0.3)));
      leftRoot.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        dirLeft
      );
      leftRoot.castShadow = true;
      leftRoot.receiveShadow = true;
      spineGroup.add(leftRoot);

      const rightRoot = new THREE.Mesh(rootGeomTemplate, nerveMaterial);
      rightRoot.position.copy(start.clone().add(dirRight.clone().multiplyScalar(0.3)));
      rightRoot.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        dirRight
      );
      rightRoot.castShadow = true;
      rightRoot.receiveShadow = true;
      spineGroup.add(rightRoot);
    }

    // Крестец и копчик
    const sacrumGeom = new THREE.CylinderGeometry(0.65, 0.8, 0.55, 10);
    const sacrum = new THREE.Mesh(sacrumGeom, boneSSSMaterial);
    sacrum.castShadow = true;
    sacrum.receiveShadow = true;
    sacrum.position.set(0, -0.55, 0.42);
    spineGroup.add(sacrum);

    const coccyxGeom = new THREE.ConeGeometry(0.4, 0.65, 7);
    const coccyx = new THREE.Mesh(coccyxGeom, boneSSSMaterial);
    coccyx.castShadow = true;
    coccyx.receiveShadow = true;
    coccyx.position.set(0, -1.1, 0.52);
    coccyx.rotation.x = 0.2;
    spineGroup.add(coccyx);

    // Подставка
    const floorGeom = new THREE.CircleGeometry(4.5, 32);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x15152a,
      roughness: 0.9,
      metalness: 0.2,
      depthWrite: false,
      transparent: true,
      opacity: 0.25,
      envMap: envMap,
      envMapIntensity: 0.3
    });
    const floor = new THREE.Mesh(floorGeom, floorMat);
    floor.receiveShadow = true;
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -1.8;
    scene.add(floor);

    // ---------- Анимация ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Двойной тап — сброс камеры
    let lastTap = 0;
    window.addEventListener('touchstart', (e) => {
      const now = Date.now();
      if (now - lastTap < 300 && e.touches.length === 1) {
        // плавный сброс
        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const endPos = new THREE.Vector3(5, 3.2, 7.5);
        const endTarget = new THREE.Vector3(0, 2.15, 0);
        const startTime = performance.now();
        function animateReset(ts) {
          const t = Math.min((ts-startTime)/800, 1);
          const ease = 1 - Math.pow(1-t, 3);
          camera.position.lerpVectors(startPos, endPos, ease);
          controls.target.lerpVectors(startTarget, endTarget, ease);
          if (t<1) requestAnimationFrame(animateReset);
        }
        requestAnimationFrame(animateReset);
      }
      lastTap = now;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Реалистичный позвоночник 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a14; font-family: system-ui, sans-serif; }
    #info {
      position: absolute; bottom: 16px; left: 16px; color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 16px;
      border-radius: 20px; font-size: 13px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">🦴 Вращай | 🔍 Зум двумя пальцами | Двойной тап — сброс</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- СЦЕНА ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d1a);
    scene.fog = new THREE.Fog(0x0d0d1a, 6, 20);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(4.5, 3, 7);
    camera.lookAt(0, 2.3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // Управление
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.3, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 1.2;
    controls.minDistance = 2.8;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;
    controls.update();

    controls.addEventListener('start', () => (controls.autoRotate = false));
    controls.addEventListener('end', () => {
      clearTimeout(window.rotTimeout);
      window.rotTimeout = setTimeout(() => (controls.autoRotate = true), 2500);
    });

    // ---------- ОКРУЖЕНИЕ ----------
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envGeom = new THREE.SphereGeometry(10, 32, 32);
    const envMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      vertexShader: `varying vec3 vPos; void main() { vPos = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `varying vec3 vPos; void main() { float y = normalize(vPos).y; gl_FragColor = vec4(mix(vec3(0.01,0.01,0.04), vec3(0.5,0.6,0.85), smoothstep(-0.1,0.5,y)), 1.0); }`
    });
    const envScene = new THREE.Scene();
    envScene.add(new THREE.Mesh(envGeom, envMat));
    const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
    scene.environment = envMap;

    // ---------- ОСВЕЩЕНИЕ ----------
    scene.add(new THREE.AmbientLight(0x303050));

    const key = new THREE.DirectionalLight(0xfff5e8, 1.5);
    key.position.set(5, 9, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 30;
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -8;
    key.shadow.bias = -0.0001;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xccddff, 0.6);
    fill.position.set(-4, 2, -2);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffccaa, 0.5);
    rim.position.set(-2, 5, -5);
    scene.add(rim);

    // ---------- ТЕКСТУРА КОСТИ ----------
    function createBoneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Базовый цвет слоновой кости
      ctx.fillStyle = '#e8dcc8';
      ctx.fillRect(0, 0, 512, 512);

      // Шум и поры
      const imgData = ctx.getImageData(0, 0, 512, 512);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const x = (i / 4) % 512;
        const y = Math.floor(i / 4 / 512);
        const n1 = (Math.sin(x * 0.2 + y * 0.18) * 43758.5453) % 1;
        const n2 = (Math.sin(x * 0.35 + y * 0.28) * 25421.631) % 1;
        const n3 = (Math.sin(x * 0.5 + y * 0.45) * 19283.471) % 1;
        const noise = n1 * 0.5 + n2 * 0.3 + n3 * 0.2;
        const variation = (noise - 0.5) * 30;
        imgData.data[i] = Math.min(255, Math.max(210, imgData.data[i] + variation));
        imgData.data[i + 1] = Math.min(255, Math.max(185, imgData.data[i + 1] + variation * 0.9));
        imgData.data[i + 2] = Math.min(255, Math.max(160, imgData.data[i + 2] + variation * 0.8));
      }
      ctx.putImageData(imgData, 0, 0);

      // Лёгкие линии роста
      ctx.strokeStyle = 'rgba(180,160,130,0.06)';
      ctx.lineWidth = 1;
      for (let y = 0; y < 512; y += 8 + Math.floor(Math.random() * 6)) {
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(y * 0.05) * 3);
        for (let x = 0; x < 512; x += 8) {
          ctx.lineTo(x, y + Math.sin(y * 0.05 + x * 0.02) * 4);
        }
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      return tex;
    }

    const boneTex = createBoneTexture();

    // Материал кости (классический PBR, без странных шейдеров)
    const boneMaterial = new THREE.MeshStandardMaterial({
      map: boneTex,
      roughness: 0.5,
      metalness: 0.03,
      color: new THREE.Color(1, 0.96, 0.88),
      envMap: envMap,
      envMapIntensity: 0.6,
    });

    // Материал дисков
    const discMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.35,
      metalness: 0.05,
      color: new THREE.Color(0xd4c5a8),
      envMap: envMap,
      envMapIntensity: 0.4,
      transparent: true,
      opacity: 0.9,
    });

    // Материал нервов
    const nerveMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.25,
      metalness: 0.0,
      color: new THREE.Color(0xf5e6a3),
      emissive: new THREE.Color(0x1a1000),
      emissiveIntensity: 0.2,
      envMap: envMap,
      envMapIntensity: 0.3,
    });

    // ---------- ГЕОМЕТРИЯ ПОЗВОНКА ----------
    function createVertebraGeometry(type = 'thoracic') {
      const group = new THREE.Group();

      // Размеры по отделам
      let bodyRadius, bodyHeight, archWidth, archDepth, spineLength, transverseLength;
      if (type === 'cervical') {
        bodyRadius = 0.38; bodyHeight = 0.24;
        archWidth = 0.65; archDepth = 0.5; spineLength = 0.3; transverseLength = 0.45;
      } else if (type === 'thoracic') {
        bodyRadius = 0.48; bodyHeight = 0.28;
        archWidth = 0.8; archDepth = 0.6; spineLength = 0.5; transverseLength = 0.55;
      } else { // lumbar
        bodyRadius = 0.6; bodyHeight = 0.32;
        archWidth = 0.95; archDepth = 0.75; spineLength = 0.65; transverseLength = 0.7;
      }

      // 1. Тело позвонка (цилиндр с фаской)
      const bodyGeom = new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyHeight, 20, 1, false);
      const body = new THREE.Mesh(bodyGeom, boneMaterial);
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // 2. Дуга позвонка (тонкий цилиндр позади тела)
      const archGeom = new THREE.TorusGeometry(bodyRadius * 0.65, 0.08, 8, 16, Math.PI);
      const arch = new THREE.Mesh(archGeom, boneMaterial);
      arch.position.z = -bodyRadius * 0.15;
      arch.rotation.x = Math.PI / 2;
      arch.rotation.z = Math.PI;
      arch.castShadow = true;
      arch.receiveShadow = true;
      group.add(arch);

      // 3. Остистый отросток (назад)
      const spineGeom = new THREE.ConeGeometry(0.08, spineLength, 8, 4);
      const spine = new THREE.Mesh(spineGeom, boneMaterial);
      spine.position.z = -bodyRadius - spineLength * 0.35;
      spine.rotation.x = Math.PI / 2;
      spine.castShadow = true;
      spine.receiveShadow = true;
      group.add(spine);

      // 4. Поперечные отростки
      [-1, 1].forEach(side => {
        const transGeom = new THREE.CylinderGeometry(0.06, 0.06, transverseLength, 8);
        const trans = new THREE.Mesh(transGeom, boneMaterial);
        trans.position.x = side * (bodyRadius + transverseLength * 0.3);
        trans.position.z = -bodyRadius * 0.1;
        trans.rotation.z = Math.PI / 2;
        trans.castShadow = true;
        trans.receiveShadow = true;
        group.add(trans);
      });

      return group;
    }

    // ---------- ПОСТРОЕНИЕ ПОЗВОНОЧНИКА ----------
    const spineGroup = new THREE.Group();
    scene.add(spineGroup);

    const totalVertebrae = 24;
    const vertSpacing = 0.56;

    // Точки кривой позвоночника
    const curvePoints = [];
    for (let i = 0; i < totalVertebrae; i++) {
      const t = i / (totalVertebrae - 1);
      const y = i * vertSpacing;
      let z = 0;
      if (t < 0.35) z = Math.sin((t / 0.35) * Math.PI * 0.75) * 0.7;
      else if (t < 0.7) z = 0.7 * Math.cos(((t - 0.35) / 0.35) * Math.PI * 0.65) - 0.15;
      else z = -0.15 + Math.sin(((t - 0.7) / 0.3) * Math.PI * 0.8) * 0.55;
      const x = Math.sin(t * Math.PI * 2) * 0.03;
      curvePoints.push(new THREE.Vector3(x, y, z));
    }

    // Создаём позвонки и диски
    for (let i = 0; i < totalVertebrae; i++) {
      const pos = curvePoints[i];
      const type = i < 7 ? 'cervical' : i < 19 ? 'thoracic' : 'lumbar';
      const vertebraGroup = createVertebraGeometry(type);
      vertebraGroup.position.copy(pos);
      vertebraGroup.rotation.y = Math.PI;
      spineGroup.add(vertebraGroup);

      // Межпозвонковый диск
      if (i < totalVertebrae - 1) {
        const nextPos = curvePoints[i + 1];
        const discY = (pos.y + nextPos.y) / 2;
        const discZ = (pos.z + nextPos.z) / 2;
        const discX = (pos.x + nextPos.x) / 2;
        const discRadius = type === 'lumbar' ? 0.58 : type === 'cervical' ? 0.36 : 0.46;
        const discGeom = new THREE.CylinderGeometry(discRadius, discRadius * 1.03, 0.18, 20);
        const disc = new THREE.Mesh(discGeom, discMaterial);
        disc.position.set(discX, discY, discZ);
        disc.castShadow = true;
        disc.receiveShadow = true;
        spineGroup.add(disc);
      }
    }

    // ---------- НЕРВНАЯ СИСТЕМА ----------
    const spinalCurve = new THREE.CatmullRomCurve3(curvePoints);
    const cordGeom = new THREE.TubeGeometry(spinalCurve, 100, 0.2, 10, false);
    const spinalCord = new THREE.Mesh(cordGeom, nerveMaterial);
    spinalCord.castShadow = true;
    spinalCord.receiveShadow = true;
    spineGroup.add(spinalCord);

    // Нервные корешки
    const rootGeom = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 6);
    for (let i = 0; i < totalVertebrae - 1; i++) {
      const pos = curvePoints[i].clone();
      pos.z -= 0.1;
      pos.y -= 0.05;

      const directions = [
        new THREE.Vector3(-0.8, -0.15, 0.15).normalize(),
        new THREE.Vector3(0.8, -0.15, 0.15).normalize(),
      ];

      directions.forEach(dir => {
        const root = new THREE.Mesh(rootGeom, nerveMaterial);
        root.position.copy(pos.clone().add(dir.clone().multiplyScalar(0.35)));
        root.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        root.castShadow = true;
        root.receiveShadow = true;
        spineGroup.add(root);
      });
    }

    // ---------- КРЕСТЕЦ И КОПЧИК ----------
    const sacrumGeom = new THREE.CylinderGeometry(0.55, 0.7, 0.5, 10);
    const sacrum = new THREE.Mesh(sacrumGeom, boneMaterial);
    sacrum.position.set(0, -0.5, 0.35);
    sacrum.castShadow = true;
    sacrum.receiveShadow = true;
    spineGroup.add(sacrum);

    const coccyxGeom = new THREE.ConeGeometry(0.35, 0.6, 8);
    const coccyx = new THREE.Mesh(coccyxGeom, boneMaterial);
    coccyx.position.set(0, -1.0, 0.45);
    coccyx.rotation.x = 0.25;
    coccyx.castShadow = true;
    coccyx.receiveShadow = true;
    spineGroup.add(coccyx);

    // ---------- ПОДСТАВКА ----------
    const floorGeom = new THREE.CircleGeometry(4, 32);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x181830,
      roughness: 0.9,
      metalness: 0.1,
      depthWrite: false,
      transparent: true,
      opacity: 0.25,
      envMap: envMap,
      envMapIntensity: 0.4,
    });
    const floor = new THREE.Mesh(floorGeom, floorMat);
    floor.receiveShadow = true;
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.6;
    scene.add(floor);

    // ---------- АНИМАЦИЯ ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Двойной тап — сброс
    let lastTap = 0;
    window.addEventListener('touchstart', e => {
      if (Date.now() - lastTap < 300 && e.touches.length === 1) {
        const sP = camera.position.clone();
        const sT = controls.target.clone();
        const eP = new THREE.Vector3(4.5, 3, 7);
        const eT = new THREE.Vector3(0, 2.3, 0);
        const st = performance.now();
        function anim(ts) {
          const t = Math.min((ts - st) / 800, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(sP, eP, ease);
          controls.target.lerpVectors(sT, eT, ease);
          if (t < 1) requestAnimationFrame(anim);
        }
        requestAnimationFrame(anim);
      }
      lastTap = Date.now();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
